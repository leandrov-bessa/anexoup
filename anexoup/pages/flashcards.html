<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flashcards</title>

    <link rel="stylesheet" href="../style/flashcards.css">
</head>

<body>

    <button id="voltar">
        <img src="../image/voltarbutton.png" alt="Voltar">
    </button>

    <button id="novoFlashcard">Novo Flashcard</button>

    <form id="formulario" hidden>
        <input type="text" placeholder="Pergunta" id="pergunta" required>
        <input type="text" placeholder="Resposta" id="resposta" required>
        <button id="adicionar">Adicionar</button>
    </form>

    <div id="exibicao"></div>

    <div id="propriedades" hidden>
        <button id="excluir">Excluir</button>
        <button id="editar">Editar</button>

        <form id="edicao" hidden>
            <input id="perguntaEdicao" placeholder="Editar pergunta">
            <input id="respostaEdicao" placeholder="Editar resposta">
            <button id="confirmarEdicao">Confirmar</button>
        </form>
    </div>

    <script src="../scripts/flashcards.js"></script>

</body>
</html>
