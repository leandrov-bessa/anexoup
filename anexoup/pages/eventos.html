<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eventos</title>

    <link rel="stylesheet" href="../style/workinprogress.css">
</head>
<body>

    <button id="voltar" aria-label="Voltar ao menu">
        <img src="../image/voltarbutton.png" alt="Voltar">
    </button>

    <main class="container">
        <section class="card">
            <div class="icone">🚧</div>

            <h1>Em desenvolvimento!</h1>

            <p>
                A área de eventos ainda está sendo desenvolvida.
                Em breve você poderá cadastrar e acompanhar seus eventos.
            </p>

            <div class="progresso">
                <div class="barra"></div>
            </div>

            <span class="status">Em construção</span>
        </section>
    </main>

    <script src="../scripts/workinprogress.js"></script>
</body>
</html>
