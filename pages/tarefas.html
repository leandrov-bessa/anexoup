<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarefas</title>

    <link rel="stylesheet" href="../style/tarefas.css">
</head>

<body>

    <button id="voltar">
        <img src="../image/voltarbutton.png" alt="Voltar">
    </button>

    <h1>TaskManager</h1>
    <p>Crie anotações e faça lembretes! Todas as informações serão salvas para que você possa revisá-las.</p>

    <div>
        <button id="criar">Criar Nova Tarefa</button>
        <form id="formCriar">
            <input type="text" placeholder="Título" id="titulo">
            <textarea placeholder="Descrição" id="descricao"></textarea>
            <button id="adicionar">Adicionar Tarefa</button>
        </form>
    </div>

    <div id="resultados"></div>

    <script src="../scripts/tarefas.js"></script>

</body>

</html>
